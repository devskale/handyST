name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: bun install

      - name: Import code-signing identity
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          echo "$MACOS_SIGNING_P12" | base64 --decode > cert.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
          rm cert.p12

      - name: Build signed release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build

      - name: Generate latest.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SIG=$(cat src-tauri/target/release/bundle/macos/handyST.app.tar.gz.sig)
          python3 - "$VERSION" "$SIG" > src-tauri/target/release/bundle/latest.json <<'PY'
          import datetime, json, sys
          version, sig = sys.argv[1], sys.argv[2]
          print(json.dumps({
              "version": version,
              "notes": f"handyST {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": sig,
                      "url": f"https://github.com/devskale/handyST/releases/download/v{version}/handyST.app.tar.gz",
                  }
              },
          }, indent=2))
          PY

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd src-tauri/target/release/bundle
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "handyST v$VERSION" \
            --notes "handyST v$VERSION — built by CI." \
            "dmg/handyST_${VERSION}_aarch64.dmg" \
            "macos/handyST.app.tar.gz" \
            "macos/handyST.app.tar.gz.sig" \
            "latest.json"
