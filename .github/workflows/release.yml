name: release

# Note: tag-push events are not delivered on this fork (verified — branch
# pushes arrive, tag pushes never trigger), so releases are dispatched:
#   gh workflow run release -f tag=v0.11.7
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.11.7; must exist). Empty = build the branch, no release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: bun install

      - name: Import code-signing identity
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          echo "$MACOS_SIGNING_P12" | base64 --decode > cert.p12
          security create-keychain -p build build.keychain
          # Never auto-lock: the 8-minute Rust compile idles the keychain
          # and the bundler's codesign would then block forever waiting for
          # a password no headless runner can type.
          security set-keychain-settings build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
          security list-keychains -s build.keychain
          rm cert.p12
          # Fail fast if signing needs interaction — the bundler would hang
          # for the full job limit instead. (macOS has no timeout(1); the
          # perl alarm kills a stuck codesign after 30s.)
          echo smoke > /tmp/codesign-smoke
          perl -e 'alarm 30; exec @ARGV' -- codesign -f -s "handyST Development" /tmp/codesign-smoke
          codesign --verify /tmp/codesign-smoke

      - name: Build signed release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          security unlock-keychain -p build build.keychain
          bun run tauri build

      - name: Generate latest.json
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            VERSION=${{ inputs.tag }}
            VERSION=${VERSION#v}
          else
            VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          SIG=$(cat src-tauri/target/release/bundle/macos/handyST.app.tar.gz.sig)
          python3 - "$VERSION" "$SIG" > src-tauri/target/release/bundle/latest.json <<'PY'
          import datetime, json, sys
          version, sig = sys.argv[1], sys.argv[2]
          print(json.dumps({
              "version": version,
              "notes": f"handyST {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": sig,
                      "url": f"https://github.com/devskale/handyST/releases/download/v{version}/handyST.app.tar.gz",
                  }
              },
          }, indent=2))
          PY

      - name: Create release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${VERSION}
          cd src-tauri/target/release/bundle
          gh release create "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "handyST v$VERSION" \
            --notes "handyST v$VERSION — built by CI." \
            "dmg/handyST_${VERSION}_aarch64.dmg" \
            "macos/handyST.app.tar.gz" \
            "macos/handyST.app.tar.gz.sig" \
            "latest.json"
